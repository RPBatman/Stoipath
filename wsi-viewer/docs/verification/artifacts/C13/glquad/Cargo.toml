[package]
name = "glquad"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = []
# 'deps' adds the kind of crates a real core pulls in: math, JSON manifest parsing, fast hashmap, logging.
deps = ["glam", "serde", "serde_json", "hashbrown", "log"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlTexture", "WebGlBuffer", "WebGlVertexArrayObject", "WebGlUniformLocation", "console"] }
glam = { version = "0.29", optional = true, default-features = false, features = ["std"] }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
hashbrown = { version = "0.15", optional = true }
log = { version = "0.4", optional = true }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
