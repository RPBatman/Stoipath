<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1b1f" />
    <title>Stage-0 WSI viewer</title>
    <style>
      :root { color-scheme: dark; --fg: #e6e6ea; --bg: #1b1b1f; --panel: rgba(20, 20, 24, 0.86); --accent: #6cc3ff; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow: hidden; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; outline: none; }
      /* Top stack (IOS-FIX.md): the status line and the error line sit above the HUD instead of under it, so "ready",
         "loading base n/m" and errors are readable on every screen; nothing in it takes pointer input. */
      #top { position: fixed; z-index: 2; top: calc(8px + env(safe-area-inset-top, 0px)); left: calc(8px + env(safe-area-inset-left, 0px)); right: calc(8px + env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; align-items: flex-start; gap: 6px; pointer-events: none; }
      #status { align-self: flex-end; box-sizing: border-box; max-width: 100%; padding: 4px 8px; background: var(--panel); border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
      #errline { align-self: flex-end; box-sizing: border-box; max-width: 100%; padding: 4px 8px; background: rgba(110, 18, 24, 0.94); color: #ffe1e1; border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
      #hud { box-sizing: border-box; padding: 6px 8px; background: var(--panel); border-radius: 6px; white-space: pre; max-width: 100%; overflow: hidden; }
      #hud canvas { display: block; margin-top: 4px; }
      /* Bottom inset keeps the buttons above the iPhone home indicator with viewport-fit=cover (REVIEW L6). The buttons
         come first and the device block is collapsible (IOS-FIX.md): Run and Export are visible without scrolling the
         panel on every phone width and orientation. */
      #panel { position: fixed; z-index: 3; left: calc(8px + env(safe-area-inset-left, 0px)); right: calc(8px + env(safe-area-inset-right, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px)); max-height: 45vh; overflow: auto; -webkit-overflow-scrolling: touch; padding: 8px; background: var(--panel); border-radius: 6px; }
      #panel .actions { display: flex; flex-wrap: wrap; gap: 4px 6px; }
      #panel pre { margin: 0 0 6px 0; white-space: pre-wrap; word-break: break-word; }
      #panel details { margin-top: 6px; }
      #panel summary { cursor: pointer; padding: 4px 0; color: var(--accent); }
      #panel button, #btn-show { font: inherit; margin: 0; padding: 6px 10px; background: #2b2b33; color: var(--fg); border: 1px solid #44444f; border-radius: 4px; cursor: pointer; min-height: 32px; }
      #panel button:active, #btn-show:active { background: #3a3a46; }
      #panel #btn-path, #panel #btn-export { border-color: var(--accent); }
      /* Touch way back to the overlay when ?overlay=1 is missing or Hide was tapped (the O key needs a keyboard). */
      #btn-show { position: fixed; z-index: 3; right: calc(8px + env(safe-area-inset-right, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px)); min-height: 40px; min-width: 64px; background: var(--panel); }
      .hidden { display: none !important; }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <canvas id="view" tabindex="0" aria-label="Whole-slide image viewer"></canvas>
    <div id="top">
      <div id="status" role="status">loading…</div><!-- "loading base n/m (errors k) — last: …" while the pinned base loads, "ready (overview loading n/m)" once it is resident, "ready" when the warm base is too; "scripted path running" / "done" during and after a run -->
      <div id="errline" class="hidden" role="alert"></div><!-- uncaught errors, frame-loop exceptions, decode-worker errors (IOS-FIX.md) -->
      <div id="hud" class="hidden"><div id="hud-text"></div><canvas id="spark" width="240" height="56"></canvas></div>
    </div>
    <button id="btn-show" class="hidden" type="button" title="Show the measurement panel (key O)">Panel</button>
    <div id="panel" class="hidden">
      <div class="actions">
        <button id="btn-path" type="button">Run scripted path</button>
        <button id="btn-export" type="button">Export JSON</button>
        <button id="btn-copy" type="button">Copy summary</button>
        <button id="btn-reset" type="button">Reset view</button>
        <button id="btn-evict" type="button" title="Drop every non-pinned tile from the GPU cache for a GPU-cold rerun. The browser HTTP cache stays warm: label the run warm.">Evict GPU tiles</button>
        <button id="btn-hide" type="button">Hide (key O)</button>
      </div>
      <details id="device-box"><summary>Device, build and slide</summary><pre id="device"></pre></details>
      <pre id="summary"></pre>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
