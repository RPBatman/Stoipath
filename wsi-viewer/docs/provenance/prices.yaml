# List prices used by tools/provenance/rollup.py, in USD per million tokens (MTok).
#
# These are Anthropic first-party API list prices. The owner ran this project on a Claude subscription plan, not on
# metered API billing, so cost computed from these prices is the comparable API cost of the same work, not money spent.
#
# Source of every price: the claude-api skill bundled with Claude Code 2.1.316 (read 2026-11-01 via the Skill tool):
#   - SKILL.md, "Current Models (cached: 2026-10-06)" table: input and output prices per model;
#   - shared/model-migration.md, "Migrating to Claude Fable 5.1" (Pricing bullet), "Migrating to Claude Opus 5.5"
#     (Pricing bullet), "Migrating to Claude Haiku 5.5": cache-write and cache-read prices per model;
#   - shared/prompt-caching.md, "Economics": cache writes cost 1.25x input for the 5-minute TTL and 2x for the 1-hour TTL.
# The skill's table is a cache dated 2026-10-06; recheck against the live pricing page before quoting a price.
# A model missing here, or with a null field, is reported by the roll-up as "unpriced" and is never estimated.
#
# Transcript usage fields -> price fields:
#   input_tokens -> input; output_tokens -> output (includes thinking tokens);
#   cache_creation.ephemeral_5m_input_tokens -> cache_write_5m; cache_creation.ephemeral_1h_input_tokens -> cache_write_1h;
#   cache_read_input_tokens -> cache_read.

as_of: "2026-11-01"
currency: "USD"
unit: "per million tokens"
basis: "Anthropic first-party API list price, standard speed, no batch discount"

models:
  claude-fable-5-1:
    input: 10.00
    output: 50.00
    cache_write_5m: 12.50
    cache_write_1h: 20.00
    cache_read: 0.25
    source: "claude-api skill: SKILL.md model table (10.00 / 50.00); shared/model-migration.md, Migrating to Claude Fable 5.1, Pricing: 5-minute cache writes 12.50, 1-hour cache writes 20, cache reads 0.25"
  claude-opus-5-5:
    input: 4.00
    output: 20.00
    cache_write_5m: 5.00
    cache_write_1h: 8.00
    cache_read: 0.20
    source: "claude-api skill: SKILL.md model table (4.00 / 20.00); shared/model-migration.md, Migrating to Claude Opus 5.5, Pricing: 5-minute cache writes 5, 1-hour cache writes 8, cache reads 0.20"
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    cache_write_5m: 0.125
    cache_write_1h: 0.20
    cache_read: 0.01
    source: "claude-api skill: SKILL.md model table (0.10 / 0.50); shared/model-migration.md, Migrating to Claude Haiku 5.5: prompts of 100K tokens or fewer; cache reads 0.1x input, 5-minute writes 1.25x, 1-hour writes 2x (prompts over 100K are billed 0.50 / 2.50). Not used by any transcript message; listed because Claude Code's own cost-state record shows Haiku 5.5 calls made inside tools"
