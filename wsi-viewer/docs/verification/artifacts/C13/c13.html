window.compileBench = async function (url) { // fetch bytes once, then compile (sync bytes) + instantiate with stub imports; also compileStreaming over a fresh fetch
  const bytes = await (await fetch(url, { cache: 'no-store' })).arrayBuffer();
  const t0 = performance.now(); const mod = await WebAssembly.compile(bytes); const compile_ms = performance.now() - t0;

  const t1 = performance.now(); let inst_ms, instErr = null; try { await WebAssembly.instantiate(mod, imp); inst_ms = performance.now() - t1; } catch (e) { inst_ms = performance.now() - t1; instErr = String(e).slice(0, 80); }

};
